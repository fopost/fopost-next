name: Release

# Tag the commit as v<version> matching package.json, e.g. v0.1.0.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm install

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          [ "$VERSION" = "$TAG" ] || { echo "::error::package.json is $VERSION but tag is $TAG"; exit 1; }

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Catches the class of bug where dist builds fine but the exports map makes it
      # unreachable to consumers. `--conditions=react-server` is what Next applies to
      # the server layer; without it `server-only` throws, which is the guarantee.
      - name: Smoke test packed tarball
        run: |
          TARBALL=$(npm pack --pack-destination /tmp | tail -1)
          mkdir -p /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm i "/tmp/$TARBALL"
          node --conditions=react-server --input-type=module -e "
            import { createFoPostWebhookHandler, foPostTags } from '@fopost/next';
            if (typeof createFoPostWebhookHandler({ secret: 'x' }) !== 'function')
              throw new Error('ESM export broken');
            if (foPostTags.posts('w_1') !== 'fopost:posts:w_1') throw new Error('ESM tags broken');
            console.log('ESM ok');
          "
          node --conditions=react-server --input-type=commonjs -e "
            const { createFoPostWebhookHandler } = require('@fopost/next');
            if (typeof createFoPostWebhookHandler({ secret: 'x' }) !== 'function')
              throw new Error('CJS export broken');
            console.log('CJS ok');
          "
          node --input-type=module -e "
            import('@fopost/next').then(
              () => { throw new Error('server-only guard is missing: the client layer could import it'); },
              () => console.log('server-only guard ok'),
            );
          "

      - name: Publish
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set"
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@fopost/next@$VERSION" version >/dev/null 2>&1; then
            echo "@fopost/next@$VERSION already published, skipping"
          else
            npm publish --access public --provenance
          fi
